<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f4f0">
<title>Fragans · Etiqueta</title>
<meta name="description" content="Fragans, comparador de precios de perfume. Maqueta B: inicio por secciones con carruseles; el catálogo va en su propia pantalla.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('estela-theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="estela.css">
<style>
.hero{padding:56px 0 8px;display:grid;justify-items:center;text-align:center;gap:18px}
.hero h1{margin:0;font:400 72px/.95 var(--serif);letter-spacing:-.02em;max-width:13ch}
.hero p{margin:0;color:var(--muted);font-size:17px;max-width:46ch}
.hero .search{max-width:680px}.hero .search input{height:60px;font-size:18px;padding-left:54px;box-shadow:var(--shadow);border-color:transparent}
.hero .search .ic{left:20px}
.hero .chips{justify-content:center;flex-wrap:wrap}
.v-b[data-view="home"]:not(.scrolled) .top .search{visibility:hidden}
.feature{display:grid;grid-template-columns:1.1fr 1fr;gap:0;border-radius:var(--r-xl);overflow:hidden;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.feature .plate{border-radius:0;aspect-ratio:auto;min-height:380px}
.feature .ftxt{padding:36px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.feature .ftxt small{color:var(--muted);font-weight:500}
.feature .fh{margin:0;font:400 44px/1 var(--serif)}
.feature .fp{display:flex;align-items:center;gap:12px}.feature .fp b{font-size:32px;font-weight:600}
.cat-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 20px}
.cat-h h1{margin:0;font:400 44px/1 var(--serif)}.cat-h .rcount{color:var(--muted);margin-left:10px;font-size:15px}
.cat-tools{display:flex;gap:8px;align-items:center}
@media (max-width:860px){.hero{padding:24px 0 0;justify-items:start;text-align:left}.hero h1{font-size:44px}.hero .chips{justify-content:flex-start;flex-wrap:nowrap}.hero .search input{height:52px}
 .feature{grid-template-columns:1fr}.feature .plate{min-height:240px}.feature .ftxt{padding:20px}.feature .fh{font-size:32px}.cat-h h1{font-size:34px}.v-b .top .search{visibility:visible}}
:root{--accent:#c13b1b;--serif:"Bricolage Grotesque",system-ui,sans-serif;--sans:"Bricolage Grotesque",system-ui,sans-serif;--bg:#f7f2ea;--plate:#f1ebe1}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#ff8f6b;--accent-ink:#2a0d05;--serif:"Bricolage Grotesque",system-ui,sans-serif;--sans:"Bricolage Grotesque",system-ui,sans-serif}}:root[data-theme="dark"]{--accent:#ff8f6b;--accent-ink:#2a0d05;--serif:"Bricolage Grotesque",system-ui,sans-serif;--sans:"Bricolage Grotesque",system-ui,sans-serif}.brand b{font:700 27px/1 var(--sans);letter-spacing:-.04em}.hero h1,.sec-h h2,.cat-h h1,.pdp h1,.rhead h1,.feature .fh{font-weight:700;letter-spacing:-.035em}.sec-h h2{font-size:30px}.hero h1{font-size:68px;line-height:.98}@media (max-width:860px){.hero h1{font-size:42px}.sec-h h2{font-size:24px}}</style>
</head>
<body class="v-b">
<script>document.write('<script src="../core.js?v='+Math.floor(Date.now()/36e5)+'"><\/script>')</script>
<script src="estela.js"></script>
<script>
const V=[["b-fragans-1.html", "1", "Lupa"], ["b-fragans-2.html", "2", "Etiqueta"], ["b-fragans-3.html", "3", "Ranking"], ["b-secciones.html", "B", "Estela"]],R=E.R;

function home(){
  const st=E.stats(),gs=E.all(),drops=E.drops(),save=E.bySave(),nicho=gs.filter(x=>R.tierOf(x.cur)==='Nicho'&&x.cur.b).sort((a,b)=>a.cur.b.p-b.cur.b.p),arab=gs.filter(x=>R.tierOf(x.cur)==='Árabe'&&x.cur.b),fav=gs.filter(x=>E.favs().includes(x.key)),t=st.top;
  E.main(`<div class="wrap"><section class="hero" aria-labelledby="hT"><h1 id="hT">Tu perfume, más barato</h1><p>${st.n} perfumes, ${st.shops} perfumerías y ${st.prices} precios leídos en las últimas 48 horas.</p>
   <div class="search">${E.ic.search(20)}<input data-q type="search" placeholder="Busca perfume, marca o nota" aria-label="Buscar perfume" autocomplete="off"></div>
   <div class="chips" role="group" aria-label="Accesos rápidos">${[['g','Hombre'],['g','Mujer'],['tier','Nicho'],['tier','Árabe']].map(([k,v])=>`<a class="chip" href="#catalogo" data-f="${k}" data-v="${v}">${v}</a>`).join('')}<a class="chip" href="#chollos">Chollos</a></div></section>
   ${fav.length?E.rail('hFav','Tus guardados','',fav):''}
   ${t?`<section class="sec"><a class="feature" href="#p/${t.key}">${E.pic(t.cur,{size:'l',eager:true})}</span><span class="ftxt"><small>La bajada del día · ${E.today()}</small><h2 class="fh">${E.esc(t.cur.name)}</h2><span class="rmeta">${E.esc(t.cur.brand)} · ${t.cur.ml} ml · en ${E.esc(t.cur.b.name)}</span><span class="fp"><b>${E.eur(t.cur.b.p)}</b><span class="pill down">${R.pct(t.cur.dr.pct)} frente a su media</span></span><span class="btn" style="align-self:start;margin-top:8px">Ver dónde comprarlo</span></span></a></section>`:''}
   ${E.rail('hDrop','Bajan hoy',st.drops+' perfumes por debajo de su media de 30 días',drops.slice(0,14),'<a href="#catalogo" data-sortdrop>Ver todos</a>')}
   <section class="sec" aria-labelledby="hFam"><div class="sec-h"><div><h2 id="hFam">Por cómo huelen</h2></div></div>${E.famTiles('famcircles')}</section>
   ${E.rail('hSave','Donde más ahorras','La diferencia entre la tienda más cara y la más barata',save.slice(0,14))}
   ${E.rail('hNicho','Nicho al mejor precio','',nicho.slice(0,14),'<a href="#catalogo" data-f="tier" data-v="Nicho">Ver todos</a>')}
   ${E.rail('hArab','Perfumería árabe','',arab.slice(0,14),'<a href="#catalogo" data-f="tier" data-v="Árabe">Ver todos</a>')}</div>`)}
function catalog(){const g=E.list(),d=E.dirty();
  E.main(`<div class="wrap">${E.msearch()}<div class="cat-h"><h1>${E.FAM&&d.length===1?E.labels().fam:'Catálogo'}<span class="rcount">${g.length} perfumes</span></h1><div class="cat-tools">${E.filterBtn()}${E.sortSel()}</div></div>${E.activeChips()}
  ${g.length?`<div class="grid">${g.slice(0,E.limit).map(E.card).join('')}</div>${E.more(g.length)}`:E.empty()}</div>`)}
addEventListener('scroll',()=>document.body.classList.toggle('scrolled',scrollY>300),{passive:true});
E.NAME='Fragans';E.TAG='Comparador de precios de perfume';E.MARK='<svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true"><path d="M9 2h8v5l4 4v15a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 5 26V11l4-4Z" fill="var(--accent)"/><circle cx="13" cy="13" r="2" fill="var(--bg)"/><path d="M9.5 19.5h7M9.5 23h4.5" stroke="var(--bg)" stroke-width="1.8" stroke-linecap="round"/></svg>';
E.start({name:'b-fragans-2.html',variants:V,home,catalog});

</script>
</body>
</html>
