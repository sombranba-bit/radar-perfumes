name: Notas olfativas
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "probe = prueba de acceso; notas = cargar pirámides"
        default: "notas"
      limite:
        description: "Perfumes como máximo en esta ejecución"
        default: "250"
      rehacer:
        description: "escasas = vuelve a buscar las pirámides con 5 notas o menos"
        default: ""
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  notas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - if: github.event.inputs.modo == 'probe'
        run: python scraper/notas_probe.py
      - if: github.event.inputs.modo == 'probe'
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe/
      - if: github.event.inputs.modo != 'probe'
        run: python scraper/notas.py
        env:
          NOTAS_LIMITE: ${{ github.event.inputs.limite }}
          NOTAS_REHACER: ${{ github.event.inputs.rehacer }}
      - if: github.event.inputs.modo != 'probe'
        name: Guardar notas
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/notas.json
          git diff --cached --quiet && exit 0
          git commit -m "Notas olfativas $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
