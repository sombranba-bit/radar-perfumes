name: Pasada de precios

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      perfumes:
        description: "Perfumes a revisar en esta pasada (70 normal, 250 = todos)"
        default: "70"
      buscar:
        description: "Búsquedas de fichas nuevas en tiendas (20 normal; más al añadir perfumes)"
        default: "20"

permissions:
  contents: write
  actions: write

jobs:
  pasada:
    # solo la pasada ocupa el turno: la espera de "siguiente" no bloquea otros workflows
    concurrency:
      group: radar
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper/test_radar.py
      - run: python scraper/radar.py
        env:
          RADAR_BATCH: ${{ github.event.inputs.perfumes || '70' }}
          RADAR_DISCOVER: ${{ github.event.inputs.buscar || '20' }}
      - name: Guardar datos
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Pasada $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          # si otra pasada guardó a la vez, en las líneas que choquen gana esta (la más reciente)
          git pull --rebase --autostash -X theirs
          git push

  # GitHub retrasa los programados (a veces 6-9 h): cada pasada deja programada la siguiente, unos 35 min después.
  # El cron de arriba queda de respaldo si la cadena se corta.
  siguiente:
    needs: pasada
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - run: |
          sleep 2100
          gh workflow run radar.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
