name: Pasada de precios

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      perfumes:
        description: "Perfumes a revisar en esta pasada (70 normal, 250 = todos)"
        default: "70"
      buscar:
        description: "Búsquedas de fichas nuevas en tiendas (20 normal; más al añadir perfumes)"
        default: "20"

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  pasada:
    # solo la pasada ocupa el turno: la espera de "siguiente" no bloquea otros workflows
    concurrency:
      group: radar
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper/test_radar.py && python scraper/test_avisos.py
      - run: python scraper/radar.py
        env:
          RADAR_BATCH: ${{ github.event.inputs.perfumes || '70' }}
          RADAR_DISCOVER: ${{ github.event.inputs.buscar || '20' }}
      - run: python scraper/paginas.py
      - name: Guardar datos
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/ p/
          git diff --cached --quiet && exit 0
          git commit -m "Pasada $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          # si otra pasada guardó a la vez, en las líneas que choquen gana esta (la más reciente)
          git pull --rebase --autostash -X theirs
          git push
      - name: Avisos de precio
        run: python scraper/avisos.py
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}

  # GitHub retrasa los programados (a veces 6-9 h): cada pasada deja programada la siguiente, unos 35 min después.
  # El cron de arriba queda de respaldo si la cadena se corta.
  siguiente:
    needs: pasada
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - run: |
          sleep 2100
          # una sola cadena: si ya hay otra pasada en cola o una lanzada después de esta, no se programa otra
          CREADA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          otras=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/radar.yml/runs?per_page=20" --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.status != \"completed\") and (.status != \"in_progress\" or .created_at > \"$CREADA\"))] | length")
          echo "otras pasadas pendientes o más nuevas: $otras"
          [ "$otras" = "0" ] && gh workflow run radar.yml -R "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ github.token }}
